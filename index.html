<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spin Kelompok</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <h1>Spin Kelompok</h1>
    <button class="btn btn-secondary" id="themeToggle" onclick="toggleTheme()">Mode Gelap</button>
  </div>

  <div class="app-container">
    <!-- KOLOM INPUT -->
    <div class="panel">
      <h2>1. Masukkan Data</h2>

      <div class="form-group">
        <label>Nama Anggota (pisahkan dengan ENTER):</label>
        <textarea
          id="namesInput"
          placeholder="Budi\nSiti\nJoko\nAni\nBella"
          oninput="cekInput()"
        ></textarea>
      </div>

      <div class="form-group">
        <label>Jumlah Kelompok:</label>
        <input type="number" id="groupCount" value="2" min="2" max="20" />
      </div>

      <button class="btn btn-generate" id="generateBtn" onclick="acakDanBagi()">
        ACAK & BAGI KELOMPOK
      </button>
      <button class="btn btn-reset" onclick="resetHalaman()">Reset</button>

      <div style="margin-top: 20px; font-size: 0.85rem; color: #666; line-height: 1.5">
        <p><strong>Cara Pakai:</strong></p>
        <ol>
          <li>Masukkan daftar nama.</li>
          <li>Tentukan jumlah kelompok.</li>
          <li>Klik tombol <strong>ACAK & BAGI</strong>.</li>
          <li>Selesai! Kelompok akan langsung muncul.</li>
        </ol>
      </div>
    </div>

    <!-- KOLOM ANIMASI (Middle) -->
    <div class="animation-panel">
      <div class="loader-icon" id="loaderIcon"></div>
      <div class="process-text" id="processText">Memproses...</div>
    </div>

    <!-- KOLOM HASIL -->
    <div class="results-container">
      <h2>2. Hasil Pengelompokan</h2>
      <div id="groupList" class="empty-state">
        <p>Belum ada hasil.</p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-label">Dibuat oleh</span>
      <span class="creator-name">ZhansDevlop</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
